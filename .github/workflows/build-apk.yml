name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libraries (bundled so the app works offline)
        run: |
          A=app/src/main/assets
          curl -fsSL https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js -o $A/marked.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js -o $A/purify.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js -o $A/highlight.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js -o $A/mermaid.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js -o $A/tex-svg.js
          ls -la $A

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PocketMarkdown.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-build-${{ github.run_number }}
          name: Pocket Markdown 2.0 (build ${{ github.run_number }})
          files: PocketMarkdown.apk
