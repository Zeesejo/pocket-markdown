plugins {
    id 'com.android.application'
}

android {
    namespace 'de.pocketmd'
    compileSdk 34

    defaultConfig {
        applicationId 'de.pocketmd.viewer'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // A fixed key so every new build installs over the previous one.
    signingConfigs {
        fixed {
            storeFile file('pocketmd.keystore')
            storePassword 'pocketmd'
            keyAlias 'pocketmd'
            keyPassword 'pocketmd'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
