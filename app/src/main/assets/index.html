<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Markdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. A two-row bar (slides away while reading) over a scrolling reading pane; Edit and Split add a source pane. Outline drawer on the left, sheets from the bottom. */
:root {
  --bg: #f6f7f8; --paper: #ffffff; --fg: #1b2127; --muted: #5d6873; --line: #dde2e7;
  --accent: #1f5f8b; --accent-fg: #ffffff; --accent-soft: #e3eef6; --code-bg: #eef1f4;
  --mark: #ffe58a; --mark-cur: #ffb648;
  --ok: #2f7d4f; --warn: #a06400; --bad: #b3362c; --violet: #6b4fb3;
  --hl-kw: #a1345e; --hl-str: #2f7d4f; --hl-num: #a35b00; --hl-com: #7b8691; --hl-fn: #1f5f8b; --hl-type: #6b4fb3;
  --shadow: 0 10px 34px rgba(20, 30, 40, .2);
  --font-ui: "Archivo", system-ui, sans-serif;
  --font-serif: "Source Serif 4", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --read-font: var(--font-serif); --size: 18px; --lh: 1.65; --measure: 68ch; --bar-h: 100px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161a; --paper: #191e23; --fg: #e3e8ec; --muted: #94a0ab; --line: #2b333b;
    --accent: #7cb8e4; --accent-fg: #0d1418; --accent-soft: #1d2d3a; --code-bg: #222a31;
    --mark: #6a5714; --mark-cur: #a8670c;
    --ok: #6cc08b; --warn: #e0a84a; --bad: #ef7b70; --violet: #b29cf0;
    --hl-kw: #f08bb3; --hl-str: #8fd19e; --hl-num: #f0b46a; --hl-com: #7f8b96; --hl-fn: #7cb8e4; --hl-type: #b29cf0;
    --shadow: 0 10px 34px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-skin="dark"] {
  --bg: #12161a; --paper: #191e23; --fg: #e3e8ec; --muted: #94a0ab; --line: #2b333b;
  --accent: #7cb8e4; --accent-fg: #0d1418; --accent-soft: #1d2d3a; --code-bg: #222a31;
  --mark: #6a5714; --mark-cur: #a8670c;
  --ok: #6cc08b; --warn: #e0a84a; --bad: #ef7b70; --violet: #b29cf0;
  --hl-kw: #f08bb3; --hl-str: #8fd19e; --hl-num: #f0b46a; --hl-com: #7f8b96; --hl-fn: #7cb8e4; --hl-type: #b29cf0;
  --shadow: 0 10px 34px rgba(0, 0, 0, .55);
  color-scheme: dark;
}
:root[data-skin="light"] {
  --bg: #f6f7f8; --paper: #ffffff; --fg: #1b2127; --muted: #5d6873; --line: #dde2e7;
  --accent: #1f5f8b; --accent-fg: #ffffff; --accent-soft: #e3eef6; --code-bg: #eef1f4;
  --mark: #ffe58a; --mark-cur: #ffb648;
  --ok: #2f7d4f; --warn: #a06400; --bad: #b3362c; --violet: #6b4fb3;
  --hl-kw: #a1345e; --hl-str: #2f7d4f; --hl-num: #a35b00; --hl-com: #7b8691; --hl-fn: #1f5f8b; --hl-type: #6b4fb3;
  --shadow: 0 10px 34px rgba(20, 30, 40, .2);
  color-scheme: light;
}
:root[data-skin="sepia"] {
  --bg: #efe5d0; --paper: #f9f2e3; --fg: #3a2e21; --muted: #786752; --line: #dfd0b3;
  --accent: #8a4b1c; --accent-fg: #fff8ec; --accent-soft: #eedcc2; --code-bg: #ede1c9;
  --mark: #f3d36c; --mark-cur: #ec9f3a;
  --ok: #4a7a33; --warn: #9a5c00; --bad: #a83a28; --violet: #74508f;
  --hl-kw: #9b3a4a; --hl-str: #4a7a33; --hl-num: #9a5c00; --hl-com: #8d7d66; --hl-fn: #8a4b1c; --hl-type: #74508f;
  --shadow: 0 10px 34px rgba(60, 40, 10, .22);
  color-scheme: light;
}
:root[data-skin="black"] {
  --bg: #000000; --paper: #0a0a0a; --fg: #d8dcdf; --muted: #8a939b; --line: #222629;
  --accent: #7cb8e4; --accent-fg: #000000; --accent-soft: #0f1d28; --code-bg: #121517;
  --mark: #5c4b10; --mark-cur: #9a5f0a;
  --ok: #6cc08b; --warn: #e0a84a; --bad: #ef7b70; --violet: #b29cf0;
  --hl-kw: #f08bb3; --hl-str: #8fd19e; --hl-num: #f0b46a; --hl-com: #727d87; --hl-fn: #7cb8e4; --hl-type: #b29cf0;
  --shadow: 0 10px 34px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-ui); -webkit-tap-highlight-color: transparent; overflow: hidden; }
button { font-family: inherit; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- Bar ---------- */
.bar { flex: none; position: relative; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); transition: margin-top .2s ease; }
.app.hide-bars .bar { margin-top: calc(3px - var(--bar-h)); }
.row { display: flex; align-items: center; gap: 6px; padding-inline: 12px; }
.row1 { padding-block: 8px 6px; }
.row2 { padding-block: 0 8px; min-height: 46px; }
.name { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-inline: 4px; }
.name strong { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }

.icon, .btn, .mini, .act, .chipbtn { appearance: none; cursor: pointer; color: var(--fg); }
.icon { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px; display: inline-grid; place-items: center; flex: none; font: 600 15px var(--font-ui); }
.icon:active, .icon[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--paper); font: 600 14px var(--font-ui); border-radius: 10px; min-height: 40px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.ghost { width: 100%; color: var(--muted); }
.mini { border: 1px solid var(--line); background: var(--paper); font: 600 12px var(--font-ui); border-radius: 7px; padding: 3px 9px; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.seg { display: inline-flex; background: var(--code-bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; font: 600 13px var(--font-ui); padding: 0 13px; min-height: 32px; border-radius: 8px; color: var(--muted); cursor: pointer; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--paper); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; padding: 0 6px; }

.search-in { flex: 1; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); font: 15px var(--font-ui); padding: 0 12px; }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 4.5em; text-align: right; }

.fmt { overflow-x: auto; scrollbar-width: none; padding-block: 0 8px; gap: 6px; }
.fmt::-webkit-scrollbar { display: none; }
.chipbtn { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; min-height: 34px; min-width: 38px; padding: 0 10px; font: 600 13px var(--font-ui); }
.chipbtn.b { font-weight: 800; }
.chipbtn.i { font-style: italic; font-family: var(--font-serif); }
.chipbtn.m { font-family: var(--font-mono); font-weight: 500; }

.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }

/* ---------- Panes ---------- */
.panes { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-inline: 16px; overscroll-behavior: contain; }
.editor { flex: 1; min-height: 0; width: 100%; border: 0; resize: none; margin: 0; padding: 16px; background: var(--paper); color: var(--fg); caret-color: var(--accent); font: 15px/1.6 var(--font-mono); tab-size: 4; outline: none; }
.app[data-mode="split"] .editor { flex: 0 0 44%; border-bottom: 1px solid var(--line); }
@media (min-width: 760px), (orientation: landscape) {
  .app[data-mode="split"] .panes { flex-direction: row; }
  .app[data-mode="split"] .editor { flex: 0 0 50%; border-bottom: 0; border-right: 1px solid var(--line); }
}

/* ---------- Document ---------- */
.doc { max-width: var(--measure); margin-inline: auto; padding-block: 24px 120px; font-family: var(--read-font); font-size: var(--size); line-height: var(--lh); overflow-wrap: break-word; }
.doc.justify p, .doc.justify li { text-align: justify; hyphens: auto; }
.doc > :first-child { margin-top: 0; }
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { font-family: var(--font-ui); line-height: 1.25; text-wrap: balance; margin: 1.6em 0 .5em; scroll-margin-top: 12px; }
.doc h1 { font-size: 1.7em; font-weight: 700; }
.doc h2 { font-size: 1.35em; font-weight: 700; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
.doc h3 { font-size: 1.12em; font-weight: 600; }
.doc h4 { font-size: 1em; font-weight: 600; }
.doc h5, .doc h6 { font-size: .9em; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.doc p, .doc ul, .doc ol, .doc blockquote, .doc pre, .doc dl, .doc details { margin: 0 0 1em; }
.doc ul, .doc ol { padding-left: 1.4em; }
.doc li + li { margin-top: .25em; }
.doc li > ul, .doc li > ol { margin: .25em 0 0; }
.doc li.task { list-style: none; position: relative; }
.doc li.task > input, .doc li.task > p > input { position: absolute; left: -1.35em; top: .32em; width: 1.05em; height: 1.05em; margin: 0; accent-color: var(--accent); cursor: pointer; }
.doc a { color: var(--accent); text-underline-offset: 2px; }
.doc blockquote { border-left: 3px solid var(--line); margin-left: 0; padding: .2em 0 .2em 1em; color: var(--muted); }
.doc blockquote > :last-child { margin-bottom: 0; }
.doc code { font-family: var(--font-mono); font-size: .84em; background: var(--code-bg); padding: .12em .35em; border-radius: 4px; }
.doc kbd { font: .8em var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: .05em .4em; background: var(--paper); }
.doc del { color: var(--muted); }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.doc img { max-width: 100%; height: auto; border-radius: 6px; cursor: zoom-in; }
.doc details { border: 1px solid var(--line); border-radius: 8px; padding: .5em .9em; }
.doc summary { cursor: pointer; font-family: var(--font-ui); font-weight: 600; }
.doc .tablewrap { overflow-x: auto; margin: 0 0 1em; }
.doc table { border-collapse: collapse; font-size: .88em; font-variant-numeric: tabular-nums; }
.doc th, .doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.doc th { background: var(--code-bg); font-family: var(--font-ui); font-weight: 600; }
.doc tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--code-bg) 45%, transparent); }
.doc .blank { color: var(--muted); font-family: var(--font-ui); font-size: 15px; text-align: center; padding-top: 3em; }

.codeblock { border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); margin: 0 0 1em; overflow: hidden; }
.codehead { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; font: 500 12px var(--font-mono); color: var(--muted); border-bottom: 1px solid var(--line); }
.codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; line-height: 1.5; }
.codeblock pre code { background: none; padding: 0; font-size: .8em; white-space: pre; }
.hljs-keyword, .hljs-selector-tag, .hljs-doctag { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-selector-attr { color: var(--hl-str); }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: var(--hl-num); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-section, .hljs-built_in, .hljs-name, .hljs-attr, .hljs-attribute { color: var(--hl-fn); }
.hljs-type, .hljs-title.class_, .hljs-class, .hljs-params, .hljs-variable, .hljs-template-variable, .hljs-selector-class { color: var(--hl-type); }
.hljs-meta, .hljs-meta .hljs-keyword { color: var(--muted); }
.hljs-deletion { color: var(--bad); }
.hljs-strong { font-weight: 700; } .hljs-emphasis { font-style: italic; }

.diagram { overflow-x: auto; margin: 0 0 1em; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); text-align: center; }
.mermaid:not([data-processed]), .mermaid.raw { white-space: pre; text-align: left; font: 13px/1.5 var(--font-mono); color: var(--muted); }
.mermaid svg { max-width: 100%; height: auto; }
.math.display { display: block; overflow-x: auto; overflow-y: hidden; text-align: center; margin: .2em 0; padding: .2em 0; }
.math.raw { font-family: var(--font-mono); font-size: .85em; color: var(--muted); }

.callout { --c: var(--accent); border-left: 3px solid var(--c); border-radius: 0 8px 8px 0; background: color-mix(in srgb, var(--c) 9%, var(--bg)); padding: .7em 1em; color: var(--fg); }
.callout-title { font: 700 12px var(--font-ui); text-transform: uppercase; letter-spacing: .07em; color: var(--c); margin-bottom: .35em; }
.c-tip { --c: var(--ok); } .c-important { --c: var(--violet); } .c-warning { --c: var(--warn); } .c-caution { --c: var(--bad); }

.fm { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: baseline; font: 14px/1.4 var(--font-ui); padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); margin: 0 0 1.8em; }
.fm dt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.fm dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 1px 9px; margin: 1px 2px 1px 0; }

mark.hit { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
mark.hit.cur { background: var(--mark-cur); box-shadow: 0 0 0 2px var(--mark-cur); }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .38); z-index: 20; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 340px); z-index: 21; background: var(--paper); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 6px 18px; }
.drawer h2, .sheet h2 { font: 600 12px var(--font-ui); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0; }
.outline { list-style: none; margin: 0; padding: 0 8px 16px; overflow-y: auto; flex: 1; }
.outline button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--fg); cursor: pointer; border-radius: 8px; padding: 8px 10px 8px calc(10px + var(--lv, 0) * 14px); font: 500 14px/1.35 var(--font-ui); }
.outline button[data-lv="0"] { font-weight: 700; }
.outline button.on { background: var(--accent-soft); color: var(--accent); }
.outline .empty, .empty { color: var(--muted); font-size: 14px; padding: 8px 10px; margin: 0; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 82vh; overflow-y: auto; background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: var(--shadow); padding-block: 8px calc(18px + env(safe-area-inset-bottom, 0px)); padding-inline: 16px; display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 640px) { .sheet { left: 50%; right: auto; width: 560px; transform: translateX(-50%); } }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 2px auto 6px; flex: none; }
.sheet h2 { margin-top: 8px; }
.swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.swatches button { border: 0; background: none; cursor: pointer; color: var(--muted); font: 600 12px var(--font-ui); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(128, 128, 128, .4); display: grid; place-items: center; font: 600 14px var(--font-serif); }
.swatches button[aria-pressed="true"] { color: var(--fg); }
.swatches button[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--accent); }
.sw-auto { background: linear-gradient(135deg, #ffffff 50%, #191e23 50%); color: #7a8691; }
.sw-light { background: #ffffff; color: #1b2127; }
.sw-sepia { background: #f9f2e3; color: #3a2e21; }
.sw-dark { background: #191e23; color: #e3e8ec; }
.sw-black { background: #000000; color: #d8dcdf; }
.field { display: flex; justify-content: space-between; align-items: baseline; font: 600 14px var(--font-ui); margin-top: 4px; }
.field output { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font: 500 15px var(--font-ui); min-height: 40px; cursor: pointer; }
.switch input { appearance: none; width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::before { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::before { transform: translateX(18px); }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.act { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font: 600 12px var(--font-ui); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.stat { background: var(--paper); padding: 8px 10px; }
.stat b { display: block; font: 600 16px var(--font-ui); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.recent-head { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.recent-head h2 { margin: 0; }
.recent { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.recent li { display: flex; gap: 6px; }
.recent .open { flex: 1; min-width: 0; text-align: left; flex-direction: column; align-items: flex-start; padding-block: 8px; min-height: 54px; }
.recent .open span { display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .open small { color: var(--muted); font-weight: 500; font-size: 12px; }
.recent .open.cur { border-color: var(--accent); }
.recent .x { width: 44px; padding: 0; color: var(--muted); }

.fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 10; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--fg); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; }
.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .9); display: flex; flex-direction: column; }
.lb-scroll { flex: 1; overflow: auto; display: grid; place-items: center; padding: 16px; }
.lb-scroll img { max-width: 100%; max-height: 100%; cursor: zoom-in; }
.lb-scroll.zoom { place-items: start; }
.lb-scroll.zoom img { max-width: none; max-height: none; width: 250%; cursor: zoom-out; }
.lightbox .icon { color: #ffffff; position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: 8px; z-index: 1; background: rgba(0, 0, 0, .4); }

title: Pocket Markdown
version: 2.0

# Pocket Markdown

Open a `.md` file with **Open**. In the Android app you can also tap a file in *My Files* and pick **Open with → Pocket Markdown**, or send one here with **Share**. This page is an example that shows what renders.

> [!TIP]
> The **☰** button shows the outline, the magnifier searches, **Aa** changes theme and text size, and **⋯** holds recent files and actions.

## Views

- **Read** shows the rendered page. The bars slide away while you scroll.
- **Edit** shows the Markdown source with a formatting bar.
- **Split** shows source and preview together. Turn the phone sideways to put them side by side.

## Task lists

Tap a box to tick it. The Markdown source updates too.

- [x] Mount sonar bracket
- [x] Calibrate IMU
- [ ] Hull test in the harbour basin

## Tables

| Sensor | Rate | Topic |
|---|---:|---|
| IMU | 200 Hz | `/imu/data` |
| Sonar | 10 Hz | `/sonar/range` |
| Camera | 30 Hz | `/cam/image_raw` |

## Code

Code blocks get syntax colours and a **Copy** button.

```python
import rclpy
from rclpy.node import Node

class Crawler(Node):
    def __init__(self):
        super().__init__("crawler")
        self.declare_parameter("max_speed", 0.25)  # m/s
```

## Diagrams

Mermaid blocks render as diagrams.

```mermaid
flowchart LR
  IMU --> EKF
  DVL[Doppler log] --> EKF
  EKF --> Planner --> Tracks[Track motors]
```

## Math

Normal force the magnets must hold on a vertical hull section:

$$F_n \geq \frac{m g \sin\theta}{\mu}$$

with a friction coefficient of $\mu \approx 0.6$ on painted steel.

> [!WARNING]
> Changes you make are kept on this phone under **Recent files**. In the Android app, use **⋯ → Save .md** to write them to a file.

const store = {

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const SAMPLE = $("sample").textContent.replace(/^\s*\n/, "");
let S = { name: "Welcome.md", text: SAMPLE, sample: true };
let mode = "read";

/* ---------- Settings ---------- */
const DEFAULTS = { skin: "auto", font: "serif", size: 18, lh: 1.65, width: "medium", justify: false, autohide: true, awake: false };
let set = Object.assign({}, DEFAULTS, store.get("pm2-settings", {}));

const WIDTHS = { narrow: "56ch", medium: "68ch", wide: "84ch", full: "100%" };
const FONTS = { serif: "var(--font-serif)", sans: "var(--font-ui)", mono: "var(--font-mono)" };

function applySettings() {
  root.dataset.skin = set.skin;
  root.style.setProperty("--size", set.size + "px");
  root.style.setProperty("--lh", set.lh);
  root.style.setProperty("--measure", WIDTHS[set.width] || WIDTHS.medium);

  document.querySelectorAll("[data-width]").forEach(b => b.setAttribute("aria-pressed", b.dataset.width === set.width));

  $("justifyT").checked = !!set.justify; $("autohideT").checked = !!set.autohide; $("awakeT").checked = !!set.awake;
  keepAwake(set.awake);
  store.set("pm2-settings", set);

}
function setOpt(k, v) { set[k] = v; applySettings(); }

const isDark = () => /dark/.test(getComputedStyle(root).colorScheme || "");
let lastDark = null;
function themeChanged() {
  const d = isDark();
  syncBars();
  if (lastDark !== null && d !== lastDark && doc.querySelector(".diagram")) renderDoc();
  lastDark = d;
}
function syncBars() {
  if (!A || typeof A.setBars !== "function") return;
  try { A.setBars(getComputedStyle(root).getPropertyValue("--paper").trim(), !isDark()); } catch (e) {}
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeChanged);
new MutationObserver(themeChanged).observe(root, { attributes: true, attributeFilter: ["data-theme"] });

let wakeLock = null;
async function keepAwake(on) {

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && set.awake) keepAwake(true); });

/* ---------- Libraries loaded on demand ---------- */
const loading = {};
function loadLib(k) {
  if (!loading[k]) loading[k] = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = LIBS[k]; s.async = true;
    s.onload = res; s.onerror = () => { delete loading[k]; s.remove(); rej(new Error("load " + k)); };

if (window.marked) marked.setOptions({ gfm: true, breaks: false });
if (window.hljs) hljs.configure({ ignoreUnescapedHTML: true });

function splitFrontMatter(t) {
  const m = t.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n(?:---|\.\.\.)[ \t]*(?:\r?\n|$)/);
  if (!m) return { meta: null, body: t };
  const meta = [];
  m[1].split(/\r?\n/).forEach(l => { const k = l.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/); if (k) meta.push([k[1], k[2].trim()]); });

}
function metaCard(meta) {
  if (!meta) return "";
  const unq = s => s.replace(/^["']|["']$/g, "");
  return '<dl class="fm">' + meta.map(([k, v]) => {
    v = unq(v);
    const list = v.match(/^\[(.*)\]$/);
    const dd = list
      ? list[1].split(",").map(x => unq(x.trim())).filter(Boolean).map(x => `<span class="chip">${esc(x)}</span>`).join(" ")
      : (v ? esc(v) : "—");
    return `<dt>${esc(k)}</dt><dd>${dd}</dd>`;
  }).join("") + "</dl>";
}

const MATH_RE = /(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]+`)|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|(?<![\\$])\$(?=[^\s$])((?:\\\$|[^$\n])*?[^\s\\$])\$(?!\d)/g;
function protectMath(src) {
  const maths = [];
  const out = src.replace(MATH_RE, (m, code, d1, d2, i1, i2) => {
    if (code) return m;
    const display = d1 != null || d2 != null;
    maths.push({ tex: d1 ?? d2 ?? i1 ?? i2, display });

}

  if (!maths.length) return 0;
  const tw = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (tw.nextNode()) if (tw.currentNode.nodeValue.includes("MATHPH")) nodes.push(tw.currentNode);

    const parts = t.nodeValue.split(/MATHPH(\d+)END/);
    if (parts.length < 2) return;
    const frag = document.createDocumentFragment();
    parts.forEach((p, i) => {
      if (i % 2 === 0) { if (p) frag.appendChild(document.createTextNode(p)); return; }

      const sp = document.createElement("span");
      sp.className = "math" + (m.display ? " display" : "");
      sp.textContent = m.display ? "\\[" + m.tex + "\\]" : "\\(" + m.tex + "\\)";

  });

const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s_-]/gu, "").replace(/\s+/g, "-");

function enhance(nMath) {
  const used = {};

    const base = slug(h.textContent) || "section";

  });

    const w = document.createElement("div"); w.className = "tablewrap";
    t.replaceWith(w); w.appendChild(t);
  });

  const diagrams = [];
  doc.querySelectorAll("pre > code").forEach(code => {
    const pre = code.parentElement;
    const lang = ((code.className.match(/language-([\w+#.-]+)/) || [])[1] || "").toLowerCase();
    if (lang === "mermaid") {
      const d = document.createElement("div"); d.className = "diagram";
      const m = document.createElement("div"); m.className = "mermaid"; m.textContent = code.textContent;
      d.appendChild(m); pre.replaceWith(d); diagrams.push(m); return;
    }
    if (window.hljs && lang && hljs.getLanguage(lang)) { try { hljs.highlightElement(code); } catch (e) {} }

$("lbImg").onclick = () => $("lbScroll").classList.toggle("zoom");
$("lbScroll").onclick = e => { if (e.target === $("lbScroll")) closeLightbox(); };

/* ---------- Drag & drop, keys, toast ---------- */
let dragDepth = 0;
addEventListener("dragenter", e => { if (![...(e.dataTransfer?.types || [])].includes("Files")) return; e.preventDefault(); dragDepth++; $("drop").hidden = false; });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").hidden = true; } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("drop").hidden = true; if (e.dataTransfer?.files?.length) openFiles(e.dataTransfer.files); });

function handleBack() {
  if (!$("lightbox").hidden) { closeLightbox(); return true; }
  if (panelOpen()) { closePanels(); return true; }
  if (searchOpen) { closeSearch(); return true; }
  if (mode !== "read") { setMode("read"); return true; }
  return false;
}
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === "f") { e.preventDefault(); openSearch(); }
  else if (mod && k === "o") { e.preventDefault(); openFile(); }
  else if (mod && k === "e") { e.preventDefault(); setMode(mode === "read" ? "split" : "read"); }
  else if (mod && e.target === editor && (k === "b" || k === "i")) { e.preventDefault(); FMT[k === "b" ? "bold" : "italic"](); }
  else if (e.key === "Escape" && e.target !== $("searchInput")) handleBack();
});

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800); }

new ResizeObserver(() => root.style.setProperty("--bar-h", $("bar").offsetHeight + "px")).observe($("bar"));

/* ---------- Bridge for the Android app ---------- */
window.openFromApp = (name, text) => { closePanels(); if (searchOpen) closeSearch(); openText(name, text); };
window.handleBack = handleBack;
window.appToast = toast;

/* ---------- Start ---------- */
applySettings();
const last = store.get("pm-last", null);
const hit = last && getRecent().find(r => r.name === last);
if (hit) {
  S = { name: hit.name, text: hit.text, sample: false };
  renderDoc();
  const r = store.get("pm-pos", {})[hit.name] || 0;
  requestAnimationFrame(() => { view.scrollTop = r * (view.scrollHeight - view.clientHeight); onScrollNow(); });
} else renderDoc();
})();
</script>
</body>
</html>
